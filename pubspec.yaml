name: piedzivo
description: "Piedzīvo.lv mobilā aplikācija kultūrai, pasākumiem un vietām."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Arhitektūra un Stāvokļa pārvaldība
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigācija (Neatkarīgiem stakiem katrā cilnē)
  go_router: ^14.0.0

  # Tīkls un API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Lokālā krātuve un kešošana
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Attēli un mediji
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0

  # Kartes un ģeolokācija
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Utilītas un sistēma
  url_launcher: ^6.2.4
  intl: ^0.19.0
  google_fonts: ^6.1.0
  sentry_flutter: ^8.0.0

  # Sociālā autentifikācija
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
